name: Record Dev Deployment

# Branch protection on `dev` requires a successful active GitHub
# environment deployment named "dev" before a PR can merge. The real
# cluster workflow (Deploy Dev) only runs after code is already on
# `dev`, so feature PRs deadlock. This job records a transient GitHub
# deployment for the PR head SHA; kube deploy still happens via
# Deploy Dev after merge.
on:
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  deployments: write

jobs:
  record-dev-deployment:
    name: Record dev environment
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record successful GitHub deployment for PR head
        uses: actions/github-script@v7
        with:
          script: |
            const ref = context.payload.pull_request.head.sha;
            const prNumber = context.payload.pull_request.number;
            const { data: deployment } = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref,
              environment: "dev",
              auto_merge: false,
              required_contexts: [],
              transient_environment: true,
              production_environment: false,
              description: `PR #${prNumber} head for required "dev" environment`,
            });
            if (!deployment || !deployment.id) {
              core.setFailed(`createDeployment did not return an id: ${JSON.stringify(deployment)}`);
              return;
            }
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.id,
              state: "success",
              environment: "dev",
              description: "Recorded for branch protection; cluster deploy still runs via Deploy Dev after merge",
            });
            core.info(`Recorded success deployment ${deployment.id} for ${ref}`);
